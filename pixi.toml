[workspace]
name = "mojo-amx-internal"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
max = "*"
python = ">=3.11"

[tasks]
test = { depends-on = ["test-all"] }
test-all = { depends-on = ["test-reductions", "test-tokenizer", "test-threading", "test-threading-trait-proto"] }
test-reductions = "mojo run -I . tests/test_reductions.mojo"
test-tokenizer = "mojo run -I . correctness_tests/test_tokenizer.mojo"
test-threading = "mojo run -I . test_threading.mojo"
test-threading-trait-proto = "mojo run -I . prototypes/test_threading_trait_proto.mojo"
